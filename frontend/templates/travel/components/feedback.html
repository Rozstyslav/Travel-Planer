<template id="loading-state">
  <div class="loading-state" role="status" data-text="message"></div>
</template>
<template id="error-state">
  <div class="empty-state error-state">
    <h2>Let’s try again</h2>
    <p data-text="message"></p>
    <button class="button button-outline" data-bind-data-action="action">
      Retry ↻
    </button>
  </div>
</template>
