<template id="account-login">
  <h2 id="modal-title">Welcome back.</h2>
  <p class="modal-description">
    Sign in to manage trips in the shared workspace. Your guest trips will stay
    in this browser.
  </p>
  <form>
    <label class="form-field"
      >Username<input
        name="username"
        autocomplete="username"
        required
        maxlength="150"
        autofocus
    /></label>
    <label class="form-field"
      >Password<input
        name="password"
        type="password"
        autocomplete="current-password"
        required
    /></label>
    <p class="form-help">Use an existing account, or continue as a guest.</p>
    <div class="form-actions">
      <button type="button" class="button button-outline" data-action="close">
        Continue as guest
      </button>
      <button type="submit" class="button button-dark">Sign in ↗</button>
    </div>
  </form>
</template>

<template id="account-details">
  <h2 id="modal-title">Your travel workspace.</h2>
  <p class="modal-description">
    You’re using the shared workspace. Trips are saved on the server. Bookmarks
    and guest trips stay in this browser.
  </p>
  <form>
    <div class="form-actions">
      <button type="button" class="button button-outline" data-action="close">
        Continue
      </button>
      <button type="submit" class="button button-dark">Sign out ↗</button>
    </div>
  </form>
</template>
