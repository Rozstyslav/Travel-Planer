<section
  id="saved-view"
  class="view inner-view"
  hidden
  aria-labelledby="saved-heading"
>
  <div class="section-heading">
    <div>
      <p class="eyebrow">A LITTLE COLLECTION OF BIG DREAMS</p>
      <h1 id="saved-heading" class="page-title">
        Places that <em>stay with you.</em>
      </h1>
    </div>
    <p class="section-intro">
      Inspiration for future journeys.<br />Keep your favourites in your account.
    </p>
  </div>
  <div class="workspace-note" data-workspace-note></div>
  <div id="saved-grid" class="art-grid" aria-live="polite"></div>
  <template id="saved-guest">
    <div class="empty-state">
      <span class="empty-symbol" aria-hidden="true">✳</span>
      <h2>Keep the places you love</h2>
      <p>Sign in to save favourite places and find them on any device. You can explore without an account.</p>
    </div>
  </template>
  <template id="saved-loading">
    <div class="loading-state" role="status">Loading your saved places…</div>
  </template>
  <template id="saved-error">
    <div class="empty-state error-state">
      <h2>Could not load your saved places</h2>
      <p data-text="message"></p>
      <button class="button button-dark" data-action="retry-saved">Try again</button>
    </div>
  </template>
  <template id="saved-empty">
    <div class="empty-state">
      <span class="empty-symbol" aria-hidden="true">✳</span>
      <h2>Save your first place</h2>
      <p>Tap the bookmark on a place you’d love to return to.</p>
      <button class="button button-dark" data-action="explore">
        Find a city <span aria-hidden="true">↗</span>
      </button>
    </div>
  </template>
</section>
